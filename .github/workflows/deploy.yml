name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Run checks and tests before deploying ─────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install all workspace deps
        run: npm ci

      - name: Astro type check
        run: npm run check -w site

      - name: Worker tests
        run: npm test -w worker

  # ── Deploy Cloudflare Worker (runs in parallel with deploy-site) ───────────────
  deploy-worker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install all workspace deps
        run: npm ci

      - name: Deploy worker to Cloudflare
        run: npm run deploy -w worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Site: Dokploy builds the Docker image from this repo ──────────────────────
  # If Dokploy's own GitHub app / auto-deploy is enabled it redeploys on push and
  # this job is a no-op. Set DOKPLOY_DEPLOY_WEBHOOK to gate the deploy on `ci`
  # passing instead (Dokploy → Application → Deployments → Webhook URL).
  deploy-site:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK not set — relying on Dokploy auto-deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK"
          echo "Dokploy deploy triggered."
